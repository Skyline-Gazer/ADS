name: Publish ADS v0.4

# Explicit publish manifest transported through a separate reviewable
# release/* -> main PR, AFTER the dev -> main promotion and private sandbox
# receipt. This does not trigger on merely merging source into main.
on:
  push:
    branches: [main]
    paths: ['release/v0.4-publish.json']

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/check-ads.py
      - name: Verify frozen source release target, exact CI and private nested receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          manifest=json.loads(Path('release/v0.4-publish.json').read_text())
          assert manifest.get('version') == 'v0.4'
          assert manifest.get('release_approved') is True
          target=manifest.get('release_target_sha','')
          assert re.fullmatch('[0-9a-f]{40}',target),target
          subprocess.run(['git','cat-file','-e',target+'^{commit}'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor',target,'HEAD'],check=True)
          changed=subprocess.check_output(['git','diff','--name-only',target,'HEAD'],text=True).splitlines()
          assert changed == ['release/v0.4-publish.json'],changed
          notes=Path('docs/releases/v0.4-notes.md').read_text()
          assert notes.startswith('# ADS v0.4')
          assert 'Known limitations' in notes
          target_runs=subprocess.run(['gh','api',
            f'/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs?head_sha={target}&per_page=100'],
            check=True,capture_output=True,text=True)
          runs=json.loads(target_runs.stdout)['workflow_runs']
          succeeded={x['name'] for x in runs if x.get('head_sha')==target and x.get('status')=='completed' and x.get('conclusion')=='success'}
          required={'Validate ADS','v0.3 isolated consumer compatibility',
                    'ADS v0.4 consumer toolchain acceptance'}
          assert required <= succeeded,sorted(required-succeeded)
          receipt=manifest.get('private_consumer_ci',{})
          assert receipt.get('result')=='success'
          assert receipt.get('workflow')=='Private ADS Submodule Acceptance'
          assert receipt.get('repository')=='Skyline-Gazer/ADS-Acceptance-Sandbox'
          rid=receipt.get('run_id')
          assert isinstance(rid,int) and rid>0
          assert receipt.get('run_url')==f'https://github.com/Skyline-Gazer/ADS-Acceptance-Sandbox/actions/runs/{rid}'
          assert receipt.get('tested_ads_sha')==target
          assert re.fullmatch('[0-9a-f]{40}',receipt.get('head_sha',''))
          assert receipt.get('verification')=='operator-verified-successful-run-and-job-logs'
          assert isinstance(receipt.get('pull_request_number'),int)
          print('v0.4 FROZEN RELEASE TARGET VERIFIED',target)
          print('CI receipts',sorted(succeeded))
          print('Trusted independent sandbox run',rid)
          PY
  publish:
    needs: [validate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ads-v0.4-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish immutable annotated v0.4 tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$(python3 -c 'import json; print(json.load(open("release/v0.4-publish.json"))["release_target_sha"])')"
          test "$(git diff --name-only "$target" HEAD)" = 'release/v0.4-publish.json'
          if git ls-remote --tags --refs origin refs/tags/v0.4 | grep -q .; then
            echo "::error::v0.4 tag already exists; never overwrite"; exit 1
          fi
          if gh release view v0.4 >/dev/null 2>&1; then
            echo "::error::v0.4 release already exists; never overwrite"; exit 1
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a v0.4 "$target" -m 'ADS v0.4 — verified consumer toolchain standard'
          git push origin refs/tags/v0.4
          gh release create v0.4 \
            --verify-tag --title 'ADS v0.4' \
            --notes-file docs/releases/v0.4-notes.md --latest
          test "$(git rev-parse refs/tags/v0.4^{})" = "$target"
          gh release view v0.4 --json tagName,name,url,isDraft,isPrerelease
