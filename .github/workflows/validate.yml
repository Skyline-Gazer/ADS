name: Validate ADS
on:
  push:
    branches: [main, "draft/**", "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test ADS checker
        run: python3 -m unittest discover -s tests -v
      - name: Validate documentation and skills
        run: python3 scripts/check-ads.py
