jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Git governance on pull requests
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ADS_DEVELOPMENT_BRANCH: ${{ github.base_ref == 'cnb/dev' && 'cnb/dev' || 'dev' }}
        run: python3 scripts/check_git_governance.py
      - name: Test ADS checker
        run: python3 -m unittest discover -s tests -v
      - name: Validate documentation and skills
        run: python3 scripts/check-ads.py
