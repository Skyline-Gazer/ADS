name: ADS Issue 90 one-shot branch cleanup
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/ads-prune-issue90.yml

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'Skyline-Gazer/ADS' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, 'issue-90-branch-prune')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate live refs and create complete branch-history archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Skyline-Gazer/ADS"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/cnb/dev" --jq .object.sha)" = "31507c6fe2c85e38abc5b962cf6c3a08d266bb93"
          test -z "$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].number')"
          mkdir -p issue90-backup
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort -u > issue90-backup/branch-names.txt
          test "$(wc -l < issue90-backup/branch-names.txt)" -gt 3
          for required in main dev cnb/dev; do
            grep -Fxq "$required" issue90-backup/branch-names.txt
          done
          git fetch --force origin '+refs/heads/*:refs/remotes/origin/*' --tags
          git ls-remote --heads origin > issue90-backup/remote-heads.tsv
          git bundle create issue90-backup/all-branches.bundle --all
          git bundle verify issue90-backup/all-branches.bundle
          git bundle list-heads issue90-backup/all-branches.bundle > issue90-backup/bundle-heads.txt
          while IFS= read -r name; do
            grep -Fq "refs/remotes/origin/$name" issue90-backup/bundle-heads.txt || {
              echo "Missing archived branch: $name" >&2
              exit 1
            }
          done < issue90-backup/branch-names.txt
          echo "Every listed remote branch has an archived Git ref."

      - name: Upload verified recovery bundle before any deletion
        uses: actions/upload-artifact@v4
        with:
          name: ads-issue90-branch-history
          path: issue90-backup/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Prune only obsolete branches and verify exactly three survivors
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/cnb/dev" --jq .object.sha)" = "31507c6fe2c85e38abc5b962cf6c3a08d266bb93"
          test -z "$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].number')"
          failed=0
          removed=0
          while IFS= read -r name; do
            case "$name" in
              main|dev|cnb/dev) continue ;;
            esac
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$name" >/dev/null; then
              echo "Deleted branch: $name"
              removed=$((removed+1))
            else
              echo "Could not delete branch: $name" >&2
              failed=$((failed+1))
            fi
          done < issue90-backup/branch-names.txt
          echo "Removed: $removed; errors: $failed"
          test "$failed" -eq 0
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort -u > issue90-backup/survivors.txt
          printf 'cnb/dev\ndev\nmain\n' > issue90-backup/expected-survivors.txt
          diff -u issue90-backup/expected-survivors.txt issue90-backup/survivors.txt
          echo "Confirmed: exactly main, dev, cnb/dev remain."
