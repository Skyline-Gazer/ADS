name: ADS v0.4 bounded consumer tool pilot

on:
  pull_request:
    paths:
      - '.github/workflows/v04-consumer-pilot.yml'
      - 'templates/consumer-devtools/**'
      - 'docs/tool-licensing.md'
      - 'docs/consumer-dev-toolchain.md'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v04-consumer-pilot.yml'
      - 'templates/consumer-devtools/**'
      - 'docs/tool-licensing.md'
      - 'docs/consumer-dev-toolchain.md'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  consumer-pilot:
    name: v0.4 tool pilot / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: KIRARI
            repository: markd3ng/KIRARI
            commit: 60691880f04ae8d36ef49f710edea09a89075514
          - name: AiringCal
            repository: Skyline-Gazer/AiringCal
            commit: 72ebdcf422e4f4e50dbb03dc9aef449a2cfcfc48
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install current stable tools on disposable CI runner only
        env:
          CONSUMER_REPO: ${{ matrix.repository }}
          CONSUMER_SHA: ${{ matrix.commit }}
        shell: bash
        run: |
          set -euo pipefail
          t0=$SECONDS
          mkdir -p "$RUNNER_TEMP/npm" "$RUNNER_TEMP/bin" "$RUNNER_TEMP/license-files"
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          npm install -g --prefix "$RUNNER_TEMP/npm" @andysom25/codegraph@latest
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/master/install.sh \
            | RTK_INSTALL_DIR="$RUNNER_TEMP/bin" sh
          "$RUNNER_TEMP/npm/bin/codegraph" --version
          "$RUNNER_TEMP/bin/rtk" --version
          echo "install_elapsed_seconds=$((SECONDS-t0))"

      - name: Verify versioned distribution licenses, provenance and full edition
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/npm/bin:$RUNNER_TEMP/bin:$PATH"
          cgver="$(codegraph --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          rtkver="$(rtk --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          test -n "$cgver" && test -n "$rtkver"
          test "$cgver" = "$(npm view @andysom25/codegraph dist-tags.latest)"
          latest_rtk="$(curl -fsSL https://api.github.com/repos/rtk-ai/rtk/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].lstrip("v"))')"
          test "$rtkver" = "$latest_rtk"
          mkdir -p "$RUNNER_TEMP/license-files/cg" "$RUNNER_TEMP/license-files/rtk"
          npm_pkg="$(npm pack "@andysom25/codegraph@$cgver" --pack-destination "$RUNNER_TEMP/license-files/cg" --silent)"
          tar -xzf "$RUNNER_TEMP/license-files/cg/$npm_pkg" -C "$RUNNER_TEMP/license-files/cg"
          cglicense="$(find "$RUNNER_TEMP/license-files/cg/package" -maxdepth 2 -iname 'LICENSE*' -type f | head -1)"
          test -n "$cglicense" && test -f "$cglicense"
          cgdist="https://registry.npmjs.org/@andysom25/codegraph/-/codegraph-$cgver.tgz"
          rtkdist="https://github.com/rtk-ai/rtk/releases/download/v$rtkver/rtk-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$rtkdist" -o "$RUNNER_TEMP/license-files/rtk/release.tar.gz"
          tar -xzf "$RUNNER_TEMP/license-files/rtk/release.tar.gz" -C "$RUNNER_TEMP/license-files/rtk"
          test -f "$RUNNER_TEMP/license-files/rtk/LICENSE"
          test -f "$RUNNER_TEMP/license-files/rtk/LICENSE-ENGINE"
          cmp "$RUNNER_TEMP/bin/rtk" "$RUNNER_TEMP/license-files/rtk/rtk"
          export CGVER="$cgver" RTKVER="$rtkver" CGDIST="$cgdist" RTKDIST="$rtkdist" CGLICENSE="$cglicense"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          base=Path(os.environ["RUNNER_TEMP"])/"license-files"
          data={"schema_version":1,"usage":"internal-development","osi_only":False,
            "tools":{
              "codegraph":{"version":os.environ["CGVER"],"edition":"cli",
                "distribution_url":os.environ["CGDIST"],
                "installed_distribution_verified":True,"latest_stable_verified":True,
                "license_file":os.environ["CGLICENSE"]},
              "rtk":{"version":os.environ["RTKVER"],"edition":"full",
                "distribution_url":os.environ["RTKDIST"],
                "installed_distribution_verified":True,"latest_stable_verified":True,
                "license_file":str(base/"rtk"/"LICENSE"),
                "engine_license_file":str(base/"rtk"/"LICENSE-ENGINE")}
            }}
          (base/"evidence.json").write_text(json.dumps(data,indent=2))
          PY
          python3 templates/consumer-devtools/check-license-compliance.py \
            "$RUNNER_TEMP/license-files/evidence.json"
          echo "Verified exact binary vs full edition release archive and versioned license files"

      - name: Run isolated consumer index, lifecycle, RTK filters and production-boundary oracles
        env:
          CONSUMER_REPO: ${{ matrix.repository }}
          CONSUMER_SHA: ${{ matrix.commit }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/npm/bin:$RUNNER_TEMP/bin:$PATH"
          scratch="$RUNNER_TEMP/consumer"
          t0=$SECONDS
          git clone -q --no-checkout --depth 1 "https://github.com/$CONSUMER_REPO.git" "$scratch"
          git -C "$scratch" fetch -q --depth 1 origin "$CONSUMER_SHA"
          git -C "$scratch" checkout -q --detach "$CONSUMER_SHA"
          test "$(git -C "$scratch" rev-parse HEAD)" = "$CONSUMER_SHA"
          (
            cd "$scratch"
            codegraph init
            codegraph status
            rtk init
            rtk gain
            rtk git status
            rtk pipeline --help
            # Force a safe source edit only in temporary cloned checkout.
            printf 'export const adsV04PilotFixture = 1;\n' > ads-v04-pilot-fixture.ts
            # Verify graph freshness via explicit recovery when no watcher is running.
            codegraph sync
            codegraph status
          )
          # The configured development-only toolchain must be rejected from production.
          if python3 templates/consumer-devtools/check-production-boundary.py \
              --root "$scratch" --target-branch main; then
            echo "::error::Production boundary guard did not reject the dev toolchain"
            exit 1
          fi
          python3 templates/consumer-devtools/check-production-boundary.py \
            --root "$scratch" --target-branch dev
          printf 'pilot=%s pinned_consumer_sha=%s elapsed_seconds=%s CI=PASS host_native_agent_integration=NOT_TESTED auto_sync_watch=NOT_TESTED\n' \
            "$CONSUMER_REPO" "$CONSUMER_SHA" "$((SECONDS-t0))"

  codegraph-source-feasibility:
    name: CodeGraph official source-build feasibility (non-release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build CodeGraph from observed official Git commit
        shell: bash
        run: |
          set -euo pipefail
          # Official main SHA observed 2026-10-25, diagnostic only.
          # This is NOT an official latest stable release.
          upstream_sha="bb11bc1226db30233ac9e66a2670c4b16dfa85fa"
          git clone -q --no-checkout https://github.com/andysom25/codegraph.git "$RUNNER_TEMP/codegraph-src"
          git -C "$RUNNER_TEMP/codegraph-src" checkout -q --detach "$upstream_sha"
          test "$(git -C "$RUNNER_TEMP/codegraph-src" rev-parse HEAD)" = "$upstream_sha"
          cd "$RUNNER_TEMP/codegraph-src"
          node -e 'const p=require("./package.json"); if (p.name !== "@andysom25/codegraph" || p.license !== "MIT") process.exit(1); console.log("SOURCE_VERSION", p.version)'
          test -f LICENSE
          npm ci --ignore-scripts
          npm run build
          node dist/bin/codegraph.js --version
          mkdir -p "$RUNNER_TEMP/codegraph-fixture"
          cd "$RUNNER_TEMP/codegraph-fixture"
          git init -q
          printf 'export function add(a: number, b: number) { return a + b; }\n' > sample.ts
          node "$RUNNER_TEMP/codegraph-src/dist/bin/codegraph.js" init .
          node "$RUNNER_TEMP/codegraph-src/dist/bin/codegraph.js" status
          echo "SOURCE_BUILD_PROBE=PASS release_provenance=UNVERIFIED stable_channel=BLOCKED"
